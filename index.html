
<!DOCTYPE html>
<html>
<head>
  <title>AI Notes</title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
    h1 { color:#38bdf8; }
    input, select, button { width:100%; padding:10px; margin:10px 0; }
    button { background:#22c55e; border:none; cursor:pointer; }
    iframe { width:100%; height:600px; background:white; }
  </style>
</head>
<body>

  <h1>AI Notes Generator</h1>

  <input id="topic" placeholder="Enter topic" />
  <select id="mode">
    <option value="balanced">Balanced</option>
    <option value="revision">Revision</option>
  </select>

  <button onclick="generate()">Generate Notes</button>

  <iframe id="output"></iframe>

  <script>
    async function generate(){
      const topic = document.getElementById("topic").value;
      const mode = document.getElementById("mode").value;

      const res = await fetch("/api/generate",{
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body: JSON.stringify({topic, mode})
      });

      const html = await res.text();
      document.getElementById("output").srcdoc = html;
    }
  </script>

</body>
</html>
